name: ShadowQUIC UI integration
on:
  push:
    branches: [feat/shadowquic-ui]
    paths-ignore:
      - e2e/shadowquic.spec.ts
      - apps/lite/scripts/shadowquic-e2e.cjs
  workflow_dispatch:
    inputs:
      browser_only:
        description: Rerun browser fixtures after test-only corrections
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: shadowquic-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        if: ${{ !inputs.browser_only }}
      - run: pnpm test:coverage
        if: ${{ !inputs.browser_only }}
      - run: pnpm build
      - run: pnpm check:size
        if: ${{ !inputs.browser_only }}
      - run: pnpm -C apps/lite install --frozen-lockfile
      - run: pnpm -C apps/lite check
        if: ${{ !inputs.browser_only }}
      - run: pnpm -C apps/lite build
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm exec playwright test e2e/shadowquic.spec.ts --project chromium
      - name: Lite browser form
        run: |
          cd apps/lite
          VITE_LITE_DEMO=1 pnpm build --outDir build/demo
          pnpm exec vite preview --outDir build/demo --host 127.0.0.1 --port 5199 --strictPort > /tmp/lite-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5199/ >/dev/null && break; sleep 0.5; done
          node scripts/shadowquic-e2e.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: shadowquic-ui-evidence
          path: |
            test-results/
            apps/lite/test-results/
            coverage/lcov.info
          retention-days: 14
